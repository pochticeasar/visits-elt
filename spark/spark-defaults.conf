spark.master                                   local[*]
spark.driver.memory                            6g
spark.sql.session.timeZone                     UTC
spark.sql.shuffle.partitions                   16
spark.sql.ansi.enabled                         false
spark.sql.sources.partitionOverwriteMode       dynamic

# S3A → Garage. Ключи берутся из AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
spark.hadoop.fs.s3a.endpoint                   http://garage:3900
spark.hadoop.fs.s3a.endpoint.region            garage
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.fast.upload                true
# Garage отвечает на пакетное удаление (POST ?delete) не так, как ждёт S3A 3.3.4,
# и тот уходит в бесконечные ретраи. Удаляем по одному объекту и не трогаем маркеры каталогов.
spark.hadoop.fs.s3a.multiobjectdelete.enable   false
spark.hadoop.fs.s3a.directory.marker.retention keep
